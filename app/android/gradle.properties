org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.44.3's Gradle plugin still requires AGP's legacy DSL adapter.
# Remove this opt-out after Flutter supports AGP 9's new DSL end to end.
android.newDsl=false
# Flutter plugins in the current dependency graph still apply KGP themselves.
android.builtInKotlin=false
# The Windows workstation keeps the Pub cache and project on different drives.
# Kotlin's incremental cache cannot relativize those paths reliably, so compile
# in-process without incremental caches. This is deterministic on CI as well.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
